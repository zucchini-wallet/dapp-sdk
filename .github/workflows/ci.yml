name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm verify:package

      - run: node --test receipt-scanner/sdk/test/*.test.mjs
      - run: npm ci && npm run build
        working-directory: examples/basic-checkout

      - run: node scripts/verify-scanner-package.mjs

  scanner-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path receipt-scanner/Cargo.toml
