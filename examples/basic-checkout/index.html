<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zucchini checkout example</title>
<style>body{font:16px system-ui;background:#101b16;color:#eee;max-width:32rem;margin:3rem auto;padding:1rem}label{display:block;margin:1rem 0}input,button{box-sizing:border-box;font:inherit;padding:.75rem;width:100%;margin:.3rem 0}button{cursor:pointer}#status{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<h1>Pay with Zucchini</h1><p>Connect first, then review a payment in your wallet. Use testnet funds for this example.</p>
<button id="connect">Connect wallet</button><p id="network"></p>
<form id="checkout"><label>Testnet receiving address<input id="recipient" required autocomplete="off"></label><label>Amount in ZEC<input id="amount" value="0.001" required inputmode="decimal" pattern="[0-9]+(\.[0-9]{1,8})?"></label><button id="pay" disabled>Review payment</button></form>
<button id="disconnect" disabled>Disconnect</button><p id="status" role="status" aria-live="polite"></p><script type="module" src="/app.js"></script></html>
