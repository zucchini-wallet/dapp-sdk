[package]
name = "zucchini-merchant-receipt-scanner"
version = "0.1.0"
edition = "2024"
publish = false
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time"] }
zcash_client_backend = { package = "zakura-client-backend", version = "=0.1.0-rc5", default-features = false, features = ["orchard", "lightwalletd-tonic-transport", "lightwalletd-tonic-tls-webpki-roots"] }
zcash_keys = { package = "zakura-keys", version = "=1.2.0", default-features = false, features = ["std", "sapling", "orchard"] }
zcash_primitives = { package = "zakura-primitives", version = "=1.2.0", default-features = false, features = ["std"] }
zcash_protocol = "=0.10.5"
zeroize = "=1.9.0"
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }

sapling = { package = "zakura-sapling-crypto", version = "=1.2.0", default-features = false, features = ["std"] }
zcash_note_encryption = "=0.4.2"
zip32 = "=0.2.1"
orchard = { package = "zakura-orchard", version = "=1.2.0", default-features = false, features = ["std"] }
incrementalmerkletree = "0.8"

[[bin]]
name = "zucchini-merchant-receipt-scanner"
path = "src/main.rs"
[dev-dependencies]
rand = "0.10"
nonempty = "0.11"
